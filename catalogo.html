<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - EduCart</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navbar Component -->
    <script src="components/navbar.js"></script>
    <custom-navbar></custom-navbar>

    <!-- Header do Catálogo -->
    <section class="bg-gradient-to-r from-primary to-secondary text-white py-12">
        <div class="container mx-auto px-4 md:px-8">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">Catálogo de Produtos 🛍️</h1>
            <p class="text-lg opacity-90">Encontre tudo que precisa para o ano letivo</p>
        </div>
    </section>

    <div class="container mx-auto px-4 md:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Filtros -->
            <div class="lg:w-1/4">
                <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Filtros 🔍</h2>
                    
                    <!-- Categoria -->
                    <div class="mb-6">
                        <h3 class="font-semibold mb-3">Categoria</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="radio" name="category" value="all" class="mr-2" checked onchange="applyFilters()">
                                <span>Todas</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="category" value="mochilas" class="mr-2" onchange="applyFilters()">
                                <span>Mochilas</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="category" value="cadernos" class="mr-2" onchange="applyFilters()">
                                <span>Cadernos</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="category" value="estojos" class="mr-2" onchange="applyFilters()">
                                <span>Estojos</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="category" value="escrita" class="mr-2" onchange="applyFilters()">
                                <span>Material de Escrita</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="category" value="tecnologia" class="mr-2" onchange="applyFilters()">
                                <span>Tecnologia</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Faixa Etária -->
                    <div class="mb-6">
                        <h3 class="font-semibold mb-3">Faixa Etária</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="all" class="mr-2" checked onchange="applyFilters()">
                                <span>Todas</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="infantil" class="mr-2" onchange="applyFilters()">
                                <span>Educação Infantil</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="fundamental1" class="mr-2" onchange="applyFilters()">
                                <span>Fundamental I</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="fundamental2" class="mr-2" onchange="applyFilters()">
                                <span>Fundamental II</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="medio" class="mr-2" onchange="applyFilters()">
                                <span>Ensino Médio</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="serie" value="universitario" class="mr-2" onchange="applyFilters()">
                                <span>Universitário</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Preço -->
                    <div class="mb-6">
                        <h3 class="font-semibold mb-3">Preço</h3>
                        <input type="range" min="0" max="1000" value="1000" class="w-full" id="priceRange" oninput="updatePriceValue(this.value)" onchange="applyFilters()">
                        <div class="flex justify-between mt-2">
                            <span>R$ 0</span>
                            <span id="priceValue">R$ 1000</span>
                        </div>
                    </div>
                    
                    <!-- Ordenação -->
                    <div class="mb-6">
                        <h3 class="font-semibold mb-3">Ordenar por</h3>
                        <select class="form-input w-full" onchange="applyFilters()" id="sortBy">
                            <option value="recent">Mais Recentes</option>
                            <option value="price-asc">Menor Preço</option>
                            <option value="price-desc">Maior Preço</option>
                            <option value="rating">Melhor Avaliação</option>
                        </select>
                    </div>
                    
                    <button onclick="clearFilters()" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition duration-300">
                        Limpar Filtros
                    </button>
                </div>
                
                <!-- Seção de Material Obrigatório -->
                <div class="bg-white rounded-2xl shadow-lg p-6 mt-6">
                    <h3 class="font-bold text-lg mb-4">📋 Material Obrigatório</h3>
                    <p class="text-gray-600 mb-4">Encontre a lista completa da sua escola</p>
                    <div class="form-input mb-3">
                        <input type="text" placeholder="Nome da escola" class="w-full border-0 focus:ring-0">
                    </div>
                    <button class="btn-secondary w-full">Buscar Lista</button>
                </div>
            </div>
            
            <!-- Produtos -->
            <div class="lg:w-3/4">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-bold">Produtos</h2>
                        <p id="productCount" class="text-gray-600">Carregando...</p>
                    </div>
                    <div class="flex items-center gap-4 mt-4 sm:mt-0">
                        <div class="hidden sm:flex items-center gap-2">
                            <button id="gridView" class="p-2 bg-primary text-white rounded-lg">
                                <i data-feather="grid" class="w-5 h-5"></i>
                            </button>
                            <button id="listView" class="p-2 bg-gray-200 text-gray-700 rounded-lg">
                                <i data-feather="list" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <select class="form-input" id="itemsPerPage" onchange="applyFilters()">
                            <option value="8">8 por página</option>
                            <option value="12">12 por página</option>
                            <option value="24">24 por página</option>
                        </select>
                    </div>
                </div>
                
                <!-- Grid de Produtos -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="catalog-products">
                    <!-- Produtos serão carregados via JavaScript -->
                </div>
                
                <!-- Paginação -->
                <div class="flex justify-center items-center gap-2 mt-12" id="pagination">
                    <!-- Paginação será gerada via JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Component -->
    <script src="components/footer.js"></script>
    <custom-footer></custom-footer>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        feather.replace();
        
        let currentView = 'grid';
        let currentPage = 1;
        let itemsPerPage = 8;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Configurar eventos de visualização
            document.getElementById('gridView').addEventListener('click', () => setView('grid'));
            document.getElementById('listView').addEventListener('click', () => setView('list'));
            
            // Carregar parâmetros da URL
            loadUrlParams();
            
            // Aplicar filtros iniciais
            applyFilters();
        });
        
        function loadUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('categoria')) {
                const categoria = urlParams.get('categoria');
                document.querySelector(`input[name="category"][value="${categoria}"]`).checked = true;
            }
            
            if (urlParams.has('serie')) {
                const serie = urlParams.get('serie');
                document.querySelector(`input[name="serie"][value="${serie}"]`).checked = true;
            }
            
            if (urlParams.has('promocao')) {
                // Lógica para promoções
            }
        }
        
        function setView(view) {
            currentView = view;
            const gridBtn = document.getElementById('gridView');
            const listBtn = document.getElementById('listView');
            
            if (view === 'grid') {
                gridBtn.className = 'p-2 bg-primary text-white rounded-lg';
                listBtn.className = 'p-2 bg-gray-200 text-gray-700 rounded-lg';
                document.getElementById('catalog-products').className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6';
            } else {
                gridBtn.className = 'p-2 bg-gray-200 text-gray-700 rounded-lg';
                listBtn.className = 'p-2 bg-primary text-white rounded-lg';
                document.getElementById('catalog-products').className = 'grid grid-cols-1 gap-6';
            }
            
            applyFilters();
        }
        
        function updatePriceValue(value) {
            document.getElementById('priceValue').textContent = `R$ ${value}`;
        }
        
        function applyFilters() {
            const category = document.querySelector('input[name="category"]:checked').value;
            const serie = document.querySelector('input[name="serie"]:checked').value;
            const maxPrice = document.getElementById('priceRange').value;
            const sortBy = document.getElementById('sortBy').value;
            itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
            
            // Filtrar produtos
            let filtered = window.filterProducts({
                category: category === 'all' ? null : category,
                serie: serie === 'all' ? null : serie,
                maxPrice: parseInt(maxPrice)
            });
            
            // Ordenar
            filtered.sort((a, b) => {
                switch(sortBy) {
                    case 'price-asc':
                        return a.price - b.price;
                    case 'price-desc':
                        return b.price - a.price;
                    case 'rating':
                        return b.rating - a.rating;
                    default:
                        return b.id - a.id; // Mais recentes primeiro
                }
            });
            
            // Atualizar contador
            document.getElementById('productCount').textContent = `${filtered.length} produtos encontrados`;
            
            // Paginar
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedProducts = filtered.slice(startIndex, endIndex);
            
            // Renderizar produtos
            const container = document.getElementById('catalog-products');
            container.innerHTML = '';
            
            if (paginatedProducts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i data-feather="search" class="w-16 h-16 text-gray-400 mx-auto mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-600">Nenhum produto encontrado</h3>
                        <p class="text-gray-500">Tente ajustar os filtros</p>
                    </div>
                `;
            } else {
                paginatedProducts.forEach(product => {
                    const productCard = window.createProductCard(product);
                    container.appendChild(productCard);
                });
            }
            
            // Renderizar paginação
            renderPagination(totalPages);
            
            feather.replace();
        }
        
        function renderPagination(totalPages) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            // Botão anterior
            const prevBtn = document.createElement('button');
            prevBtn.className = 'p-2 bg-gray-100 rounded-lg hover:bg-gray-200 disabled:opacity-50';
            prevBtn.innerHTML = '<i data-feather="chevron-left" class="w-5 h-5"></i>';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    applyFilters();
                }
            });
            container.appendChild(prevBtn);
            
            // Números das páginas
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.className = `px-4 py-2 rounded-lg ${currentPage === i ? 'bg-primary text-white' : 'bg-gray-100 hover:bg-gray-200'}`;
                    pageBtn.textContent = i;
                    pageBtn.addEventListener('click', () => {
                        currentPage = i;
                        applyFilters();
                    });
                    container.appendChild(pageBtn);
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'px-2';
                    ellipsis.textContent = '...';
                    container.appendChild(ellipsis);
                }
            }
            
            // Botão próximo
            const nextBtn = document.createElement('button');
            nextBtn.className = 'p-2 bg-gray-100 rounded-lg hover:bg-gray-200 disabled:opacity-50';
            nextBtn.innerHTML = '<i data-feather="chevron-right" class="w-5 h-5"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    applyFilters();
                }
            });
            container.appendChild(nextBtn);
            
            feather.replace();
        }
        
        function clearFilters() {
            document.querySelector('input[name="category"][value="all"]').checked = true;
            document.querySelector('input[name="serie"][value="all"]').checked = true;
            document.getElementById('priceRange').value = 1000;
            document.getElementById('priceValue').textContent = 'R$ 1000';
            document.getElementById('sortBy').value = 'recent';
            currentPage = 1;
            
            applyFilters();
        }
    </script>
</body>
</html>
